# Lokální MySQL pro vývoj a testy (na Endoře běží jejich vlastní MySQL).
# Spuštění: npm run db:start
services:
  mysql:
    image: mysql:8.0
    container_name: dnd_mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: dnd
      MYSQL_PASSWORD: dnd
      MYSQL_DATABASE: dnd
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dnd_mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  dnd_mysql_data:
